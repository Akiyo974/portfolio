    <style>
      /* CSS critique : écran de démarrage affiché avant le JavaScript (premier rendu immédiat) */
      html, body { background-color: #050505; margin: 0; padding: 0; color: #f2f2ee; }
      .shell { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; justify-content: space-between;
        padding: 20px 16px; background: #050505; color: #f2f2ee; font-family: 'Geist Mono', ui-monospace, Consolas, monospace; }
      .shell-top { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .6; }
      .shell-count { font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 300; line-height: .78;
        font-size: clamp(7rem, 26vw, 24rem); font-variant-numeric: tabular-nums; }
      .shell-bar { margin-top: 16px; height: 1px; background: rgba(242,242,238,.12); }
      .shell-bar i { display: block; height: 1px; background: #f2f2ee; transform-origin: left; transform: scaleX(0); transition: transform .3s; }
      .shell-quiet .shell-top, .shell-quiet .shell-count, .shell-quiet .shell-bar { visibility: hidden; }
      @media (min-width: 768px) { .shell { padding: 32px 40px; } }
    </style>

  <body>
    <div id="root">
      <div class="shell" id="shell" role="status" aria-label="Loading">
        <div class="shell-top"><span>Christen Dijoux — Portfolio</span><span>©2026</span></div>
        <div>
          <span class="shell-count" id="shell-count">000</span>
          <div class="shell-bar"><i id="shell-bar"></i></div>
        </div>
      </div>
    </div>
    <script>
      // Compteur pendant le chargement du JavaScript ; le préchargeur React reprend à cette valeur
      (function () {
        var quiet = false;
        try { quiet = sessionStorage.getItem('cd-intro-seen') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
        var el = document.getElementById('shell');
        if (quiet) { el.className += ' shell-quiet'; return; }
        var c = document.getElementById('shell-count'), bar = document.getElementById('shell-bar'), v = 0;
        window.__plCount = 0;
        var id = setInterval(function () {
          if (!document.getElementById('shell-count')) return clearInterval(id);
          v = Math.min(60, v + Math.max(1, (60 - v) * 0.08));
          window.__plCount = v;
          c.textContent = ('00' + Math.round(v)).slice(-3);
          bar.style.transform = 'scaleX(' + v / 100 + ')';
        }, 60);
      })();
    </script>
