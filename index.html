      /* CSS critique : écran de démarrage affiché avant le JavaScript (premier rendu immédiat) */
      html, body { background-color: #050505; margin: 0; padding: 0; color: #f2f2ee; }
      .shell { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; justify-content: space-between;
        padding: 20px 16px; background: #050505; color: #f2f2ee; font-family: 'Geist Mono', ui-monospace, Consolas, monospace; }
      .shell-top { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .6; }
      .shell-count { font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 300; line-height: .78;
        font-size: clamp(7rem, 26vw, 24rem); font-variant-numeric: tabular-nums; }
      .shell-bar { margin-top: 16px; height: 1px; background: rgba(242,242,238,.12); }
      .shell-bar i { display: block; height: 1px; background: #f2f2ee; transform-origin: left; transform: scaleX(0); transition: transform .3s; }
      .shell-quiet .shell-top, .shell-quiet .shell-count, .shell-quiet .shell-bar { visibility: hidden; }
      @media (min-width: 768px) { .shell { padding: 32px 40px; } }
      /* Badge Awwwards : collé au cadre de la fenêtre, sous le curseur (z 90) et sous les écrans de chargement/transition */
      /* Badge Awwwards en « note de marge » : languette de 18px collée au cadre ; au survol / focus / 1er toucher (.is-open),
         le badge sort de derrière le cadre par paliers et le libellé se brouille en « Honorable Mention » (script plus bas) */
      #awwwards { position: fixed; z-index: 85; top: 50%; right: 8px; transform: translateY(-50%); line-height: 0; }
      #awwwards a { position: relative; display: block; outline-offset: 2px; text-decoration: none; }
      #awwwards .aw-tab { display: flex; align-items: center; justify-content: center; width: 18px; height: 171px;
        border: 1px solid rgba(242,242,238,.28); border-right: 0; background: #050505; transition: background .25s steps(2, end); }
      #awwwards .aw-label { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; color: #f2f2ee; opacity: .6;
        font: 500 9px/1 'Geist Mono', ui-monospace, Consolas, monospace; letter-spacing: .22em; text-transform: uppercase; transition: opacity .25s; }
      #awwwards .aw-panel { position: absolute; top: 0; right: 100%; border: 1px solid rgba(242,242,238,.28); border-right: 0;
        clip-path: inset(0 0 0 100%); pointer-events: none; transition: clip-path .42s steps(7, end); }
      #awwwards svg { display: block; }
      #awwwards .js-color-bg { fill: #050505; }
      #awwwards .js-color-text { fill: #f2f2ee; }
      #awwwards a:focus-visible .aw-panel, #awwwards.is-open .aw-panel { clip-path: inset(0); pointer-events: auto; }
      #awwwards a:focus-visible .aw-tab, #awwwards.is-open .aw-tab { background: #f2f2ee; }
      #awwwards a:focus-visible .aw-label, #awwwards.is-open .aw-label { color: #050505; opacity: 1; }
      @media (hover: hover) {
        #awwwards a:hover .aw-panel { clip-path: inset(0); pointer-events: auto; }
        #awwwards a:hover .aw-tab { background: #f2f2ee; }
        #awwwards a:hover .aw-label { color: #050505; opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) { #awwwards .aw-panel, #awwwards .aw-tab { transition: none; } }
      @media (max-width: 640px) { #awwwards { right: 4px; transform: translateY(-50%) scale(.8); transform-origin: right center; } }
    </style>

    <script>
      // Badge Awwwards : libellé brouillé à l'ouverture / fermeture ; sur écran tactile, 1er toucher = déplier,
      // 2e = ouvrir le lien, toucher ailleurs = replier
      (function () {
        var box = document.getElementById('awwwards');
        if (!box) return;
        var link = box.querySelector('a'), label = box.querySelector('.aw-label');
        var mm = function (q) { return window.matchMedia ? matchMedia(q).matches : false; };
        var still = mm('(prefers-reduced-motion: reduce)'), glyphs = '█▓▒░/\\#*+-01', raf = 0, opened = false;
        function scramble(to) {
          cancelAnimationFrame(raf);
          if (still) { label.textContent = to; return; }
          var from = label.textContent, len = Math.max(from.length, to.length), t0 = performance.now();
          (function tick(now) {
            var p = Math.min(1, (now - t0) / 480), out = '';
            for (var i = 0; i < len; i++) {
              if (i < p * len) out += to.charAt(i);
              else out += Math.random() < .5 ? glyphs.charAt(Math.random() * glyphs.length | 0) : (from.charAt(i) || '');
            }
            label.textContent = out;
            if (p < 1) raf = requestAnimationFrame(tick);
          })(t0);
        }
        function set(open) { if (open !== opened) { opened = open; scramble(open ? 'Honorable Mention' : 'Awwwards'); } }
        link.addEventListener('focus', function () { set(true); });
        link.addEventListener('blur', function () { if (box.className.indexOf('is-open') < 0) set(false); });
        if (mm('(hover: hover)')) {
          link.addEventListener('mouseenter', function () { set(true); });
          link.addEventListener('mouseleave', function () { if (document.activeElement !== link) set(false); });
        } else {
          document.addEventListener('click', function (e) {
            var inside = box.contains(e.target);
            if (inside && box.className.indexOf('is-open') < 0) { e.preventDefault(); box.className += ' is-open'; set(true); }
            else if (!inside) { box.className = box.className.replace(/\s*is-open/g, ''); set(false); }
          }, true);
        }
      })();
    </script>
    <script>
      // Compteur pendant le chargement du JavaScript ; le préchargeur React reprend à cette valeur
      (function () {
        var quiet = false;
        try { quiet = sessionStorage.getItem('cd-intro-seen') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
        var el = document.getElementById('shell');
        if (quiet) { el.className += ' shell-quiet'; return; }
        var c = document.getElementById('shell-count'), bar = document.getElementById('shell-bar'), v = 0;
        window.__plCount = 0;
        var id = setInterval(function () {
          if (!document.getElementById('shell-count')) return clearInterval(id);
          v = Math.min(60, v + Math.max(1, (60 - v) * 0.08));
          window.__plCount = v;
          c.textContent = ('00' + Math.round(v)).slice(-3);
          bar.style.transform = 'scaleX(' + v / 100 + ')';
        }, 60);
      })();
